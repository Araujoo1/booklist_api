{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="card shadow">
    <div class="row g-0">
      <div class="col-md-4">
        <img src="{{ livro.capa_url }}" class="img-fluid rounded-start" alt="Capa do livro">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h2 class="card-title">{{ livro.titulo }}</h2>
          <p class="card-text"><strong>Autor:</strong> {{ livro.autor }}</p>
          <p class="card-text"><strong>Data de Publicação:</strong> {{ livro.data_publicacao }}</p>
          <p class="card-text"><strong>Status:</strong> 
            {% if livro.lido %}
              <span class="badge bg-success">Lido</span>
            {% else %}
              <span class="badge bg-secondary">Não lido</span>
            {% endif %}
          </p>
          <p class="card-text"><strong>Descrição:</strong><br>{{ livro.descricao }}</p>
          <div class="mt-3">
            <a href="{% url 'editar' livro.id %}" class="btn btn-outline-primary">Editar</a>
            <a href="{% url 'livros' %}" class="btn btn-outline-secondary">Voltar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
