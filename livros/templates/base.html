{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Minha Booklist{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilo personalizado -->
    <link rel="stylesheet" href="{% static 'livros/css/estilo.css' %}">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

  <!-- Botão Dark Mode -->
<body>
  <button id="toggle-darkmode" class="btn btn-sm btn-outline-dark position-absolute top-0 end-0 m-3 z-3">
    🌙 Dark Mode
  </button>

    <!-- Conteúdo dinâmico -->
    {% block content %}{% endblock %}

    <!-- Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'livros/js/excluir_modal.js' %}"></script>
    <script src="{% static 'livros/js/mensagens_auto.js' %}"></script>
    <script src="{% static 'livros/js/favorito.js' %}"></script>
    <script src="{% static 'livros/js/darkmode.js' %}"></script>
</body>
</html>
