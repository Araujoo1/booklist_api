{% extends 'base.html' %}
{% load static %}
{% load form_extras %}
{% block title %}Cadastrar Livro{% endblock %}

{% block content %}
<div class="container mt-5">
  <h2 class="mb-4 text-center">Cadastrar Livro</h2>

  <div class="d-flex justify-content-center my-4 gap-3">
    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg">🏠 Home</a>
    <a href="{% url 'livros' %}" class="btn btn-outline-success btn-lg">📔 Meus Livros</a>
  </div>

  <form method="post">
    {% csrf_token %}

    <!-- Campo de busca com sugestões -->
    <div class="mb-3">
      <label for="busca-livro" class="form-label">Busque o título do livro</label>
      <input type="text" id="busca-livro" class="form-control" placeholder="Digite o nome do livro">
      <ul id="sugestoes" class="list-group mt-2"></ul>
    </div>

    <!-- Campos preenchíveis (vêm da API ou manual) -->
    <div class="mb-3">
      <label for="titulo" class="form-label">Título</label>
      <input type="text" id="titulo" name="titulo" class="form-control"
             value="{{ form.titulo.value|default_if_none:'' }}">
    </div>

    <div class="mb-3">
      <label for="autor" class="form-label">Autor</label>
      <input type="text" id="autor" name="autor" class="form-control"
             value="{{ form.autor.value|default_if_none:'' }}">
    </div>

    <div class="mb-3">
      <label for="data_publicacao" class="form-label">Data de Publicação</label>
      <input type="text" id="data_publicacao" name="data_publicacao" class="form-control"
             value="{{ form.data_publicacao.value|default_if_none:'' }}">
    </div>

    <div class="form-check mb-3">
      <input type="checkbox" id="lido" name="lido" class="form-check-input"
             {% if form.lido.value %}checked{% endif %}>
      <label for="lido" class="form-check-label">Já li este livro</label>
    </div>

    <!-- Campos ocultos preenchidos via JS -->
    <input type="hidden" id="descricao" name="descricao" value="{{ descricao }}">
    <input type="hidden" id="capa_url" name="capa_url" value="{{ capa_url }}">

    <button type="submit" class="btn btn-primary">Cadastrar</button>
  </form>
</div>

<!-- Link para o script -->
<script src="{% static 'livros/js/busca.js' %}"></script>
{% endblock %}
